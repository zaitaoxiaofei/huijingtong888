<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ozon ERP 采集</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <div>
          <h1>数据分析采集</h1>
          <p id="statusText">读取状态中</p>
        </div>
        <button id="refreshBtn" class="icon-btn" type="button" title="刷新状态" aria-label="刷新状态">↻</button>
      </header>

      <section class="section config-section">
        <div class="section-heading">
          <h2>连接设置</h2>
          <span id="saveFeedback" class="save-feedback" role="status" aria-live="polite"></span>
        </div>
        <div class="field-grid">
        <label>
          <span>ERP 地址</span>
          <input id="erpBaseUrl" type="text" autocomplete="off">
        </label>
        <label>
          <span>企业租户</span>
          <input id="tenantId" type="text" autocomplete="off">
        </label>
        </div>
        <label>
          <span>企业密钥</span>
          <input id="localPluginToken" type="password" autocomplete="off" placeholder="粘贴企业管理中生成的专属令牌">
        </label>
        <div class="actions config-actions">
          <button id="saveBtn" type="button" class="primary">保存连接设置</button>
          <button id="authProbeBtn" type="button">测试连接</button>
        </div>
      </section>

      <section class="section control-section">
        <div class="status-line">
          <span>采集状态</span>
          <strong id="pollingStatus">未启动</strong>
        </div>
        <div class="actions control-actions">
          <button id="pollBtn" type="button" class="primary">立即采集</button>
          <button id="startPollingBtn" type="button" class="button-start">启动轮询</button>
          <button id="stopPollingBtn" type="button" class="button-stop">暂停轮询</button>
        </div>
      </section>

      <section class="stats">
        <div><span>领取</span><strong id="claimedCount">0</strong></div>
        <div><span>成功</span><strong id="completedCount">0</strong></div>
        <div><span>失败</span><strong id="failedCount">0</strong></div>
        <div><span>执行中</span><strong id="activeCount">0</strong></div>
      </section>

      <section class="section compact-section">
        <div class="section-heading">
          <div><h2>最近日志</h2><small>最多保留 200 条，导出可查看完整记录</small></div>
          <button id="exportLogsBtn" type="button" class="text-btn">导出日志</button>
        </div>
        <div id="logList" class="list empty">暂无日志</div>
      </section>

      <details class="section runtime">
        <summary>运行状态与 Ozon 页面</summary>
        <div class="runtime-grid">
          <div class="runtime-card">
            <span>页面状态</span>
            <strong id="pageStatus">等待识别</strong>
            <em id="pageStatusHint">请打开 Ozon 数据分析页</em>
          </div>
          <div class="runtime-card">
            <span>同步任务</span>
            <strong id="taskStatus">等待任务</strong>
            <em id="taskStatusHint">暂无执行中的采集任务</em>
          </div>
          <div class="runtime-card">
            <span>服务状态</span>
            <strong id="serviceStatus">已连接官网</strong>
            <em id="serviceStatusHint">https://erp.hjt888.xyz/</em>
          </div>
        </div>
        <div class="seller-context"><span>Ozon 页面</span><span id="sellerTab" class="muted">未找到</span></div>
      </details>

      <details class="section compact-section">
        <summary>当前队列</summary>
        <div id="queueList" class="list empty">暂无任务</div>
      </details>
    </main>
    <script src="popup.js"></script>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>财务原件归档</title><link rel="stylesheet" href="finance-documents.css"></head>
<body class="archive-page"><main>
  <header class="archive-heading"><h1>财务原件归档</h1><label class="language-control">原件语言<select id="language"><option value="en">英语</option><option value="ru">俄语</option></select></label></header>
  <section class="shop-section">
    <div class="controls shop-controls">
      <label>ERP 页面<select id="erp-tab"></select></label>
      <label class="seller-control">Ozon 店铺<select id="seller-tab"></select></label>
      <button id="refresh" type="button">刷新列表</button>
    </div>
    <div class="shop-match"><span id="identity" role="status" aria-live="polite" data-state="pending">核对中…</span><button id="identify" type="button">重新识别</button></div>
  </section>
  <section class="month-section">
    <div class="section-heading"><h2>归档月份</h2><label class="year-control"><input id="year" aria-label="年份" type="number" min="2000" max="2099">年</label><span id="selection-count"></span></div>
    <div id="month-picker" aria-label="选择归档月份"></div>
    <div class="month-shortcuts"><button id="select-all" type="button">全年</button><button id="select-ten" type="button">1—10月</button><button id="select-none" type="button">清空</button></div>
  </section>
  <section class="destination-section"><h2>保存位置</h2><div class="destination-row"><button id="choose-folder" type="button">选择文件夹</button><span id="destination">未选择</span></div></section>
  <details class="folder-options"><summary id="folder-summary">官方目录 · 全部 10 类</summary><div id="folders" class="actions"></div></details>
  <section class="actions download-mode" aria-label="下载方式">
    <label><input id="only-missing" type="radio" name="download-mode" checked>只补缺失文件</label>
    <label><input id="overwrite" type="radio" name="download-mode">重新下载并覆盖</label>
  </section>
  <div id="month-results" class="month-results" hidden><table><thead><tr><th>下载</th><th>月份</th><th>公司主体</th><th>本地文件</th></tr></thead><tbody id="months"></tbody></table></div>
  <footer class="archive-footer"><div class="actions"><button id="check" type="button">检查已有文件</button><button id="download" type="button" disabled>开始下载</button><button id="stop" type="button" disabled hidden>停止</button></div><p id="status" role="status" aria-live="polite"></p></footer>
  <details class="download-log"><summary>下载记录</summary><pre id="results"></pre></details>
  <details class="other-options"><summary>其他入口</summary><a href="finance-documents.html">单月下载</a></details>
</main>
<script src="finance-documents-core.js"></script><script src="finance-documents-transport.js"></script>
<script src="finance-documents-archive.js"></script><script src="finance-erp-context.js"></script><script src="finance-archive.js"></script>
</body></html>
